name: Update EPG Final 2

on:
  schedule:
    # Executa todos os dias às 03:00 Horário de Brasília (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml

      - name: Run EPG Script
        run: python epgfinal.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "104462712+JulioCesarXY@users.noreply.github.com"
          git config --local user.name "JulioCesarXY"
          git add epg/epg_final2.xml epg/epg_final2.xml.gz
          if ! git diff --cached --quiet; then
            git commit -m "Auto update EPG: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main --autostash
            git push origin main
          else
            echo "No changes to commit"
          fi